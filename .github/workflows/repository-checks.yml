name: 仓库检查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查项目结构
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md LICENSE.md NOTICE.md THIRD_PARTY_NOTICES.md
            CONTRIBUTING.md SECURITY.md
            docs/repo-map.md docs/architecture.md docs/manual-install.md docs/release.md
            addons/godot_ai_manager/plugin.cfg
            addons/godot_ai_manager/godot_ai_manager.gd
            addons/godot_ai_manager/godot_ai_manager_dock.gd
            addons/godot_ai_manager/codex_backend.gd
            addons/godot_ai_manager/kimi_backend.gd
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "缺少文件：$path"; exit 1; }
          done
      - name: 检查不应存在的旧项目文件
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            .apply_provider_update .apply_provider_update_v4
            addons/fennara fennara-cpp local godot_demo runtime ui media scripts
            install.ps1 install.sh VERSION CONTEXT.md llms.txt
          )
          for path in "${forbidden[@]}"; do
            test ! -e "$path" || { echo "发现遗留路径：$path"; exit 1; }
          done
      - name: 检查 MCP 边界
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '127\.0\.0\.1:41287|/tools/call|fennara-mcp|mcp_servers\.fennara' addons tests --exclude=codex_config_manager.gd; then
            echo "发现 Fennara MCP/runtime 残留"
            exit 1
          fi
          grep -RIn 'godot-mcp' addons/godot_ai_manager >/dev/null
          test "$(find addons -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
